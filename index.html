<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Precision Metronome, Tuner, and Setlist PWA">
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon.svg">

  <title>GroovePulse &bull; Metronome &amp; Tuner</title>

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <!-- Custom App Styles -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="d-flex flex-column">

  <!-- Fullscreen Silent Visual Flash Overlay -->
  <div id="screenFlashOverlay"></div>

  <!-- Navigation Tabs directly at top for maximum vertical space -->
  <div class="container-sm pt-2 pb-1">
    <ul class="nav nav-pills nav-fill bg-dark p-1 rounded-pill border border-secondary" id="pills-tab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="pills-metronome-tab" data-bs-toggle="pill" data-bs-target="#pills-metronome" type="button" role="tab" aria-selected="true">
          <i class="bi bi-stopwatch me-1"></i>Metronome
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="pills-setlist-tab" data-bs-toggle="pill" data-bs-target="#pills-setlist" type="button" role="tab" aria-selected="false">
          <i class="bi bi-music-note-list me-1"></i>Setlist
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="pills-tuner-tab" data-bs-toggle="pill" data-bs-target="#pills-tuner" type="button" role="tab" aria-selected="false">
          <i class="bi bi-tuning me-1"></i>Tuner
        </button>
      </li>
    </ul>
  </div>

  <!-- Main Content Areas -->
  <main class="container-sm flex-grow-1 mb-2">
    <div class="tab-content" id="pills-tabContent">

      <!-- ================= 1. METRONOME TAB ================= -->
      <div class="tab-pane fade show active" id="pills-metronome" role="tabpanel">

        <!-- Quick Song Header Bar (Connects to Setlist) -->
        <div class="custom-card p-1 px-3 mb-2 d-flex align-items-center justify-content-between">
          <button id="quickPrevSongBtn" class="btn btn-outline-light btn-sm text-white" title="Previous Song">
            <i class="bi bi-skip-start-fill"></i>
          </button>
          <div class="text-center overflow-hidden px-2 flex-grow-1">
            <div class="d-flex align-items-center justify-content-center">
              <span id="activeSongBadge" class="fw-bold text-truncate text-white" style="font-size: 1.05rem;">Free Mode (No Song)</span>
              <button id="clearActiveSongBtn" class="btn btn-sm btn-link text-warning p-0 ms-2 d-none" title="Return to Free Mode (clear song)">
                <i class="bi bi-x-circle-fill"></i>
              </button>
            </div>
            <small id="activeSongSubText" class="text-white text-truncate d-block fw-semibold" style="opacity: 0.9; font-size: 0.8rem;">Manual Tempo</small>
          </div>
          <button id="quickNextSongBtn" class="btn btn-outline-light btn-sm text-white" title="Next Song">
            <i class="bi bi-skip-end-fill"></i>
          </button>
        </div>

        <!-- Main Metronome Display - Vertically Compact & Optimized -->
        <div class="custom-card p-2 px-3 mb-2 text-center">
          
          <!-- Tempo Number + BPM on same line -->
          <div class="d-flex align-items-baseline justify-content-center gap-2 mb-1">
            <span class="tempo-display" id="tempoDisplay">120</span>
            <span class="text-white fw-bold fs-5 text-uppercase">BPM</span>
          </div>

          <!-- Circular Visual Beat Flasher (LEFT) + TAP & PLAY Stacked (RIGHT) -->
          <div class="row g-2 align-items-center mb-2">
            <!-- Left: Beat Flasher + Signature Dots -->
            <div class="col-5 d-flex flex-column justify-content-center align-items-center">
              <div id="beatFlasher" class="beat-flasher shadow">
                <span id="beatFlasherNumber">-</span>
              </div>
              <div id="beatDotsContainer" class="mt-2"></div>
            </div>

            <!-- Right: TAP and START/STOP stacked -->
            <div class="col-7 d-flex flex-column gap-2 justify-content-center">
              <!-- TAP TEMPO BUTTON -->
              <button id="tapButton" class="btn btn-tap w-100 shadow-sm">
                <span class="text-white fw-bolder fs-5"><i class="bi bi-hand-index-thumb-fill me-1"></i>TAP TEMPO</span>
                <span id="tapSubtext" class="text-white small fw-semibold" style="font-size: 0.85rem; opacity: 0.95;">Detect tempo</span>
              </button>

              <!-- START / STOP BUTTON -->
              <button id="playButton" class="btn btn-success btn-play w-100 shadow">
                <i id="playButtonIcon" class="bi bi-play-fill me-1 fs-3"></i><span id="playButtonText" class="fs-4">Start</span>
              </button>
            </div>
          </div>

          <!-- Quick Delta Buttons (-5, -1, +1, +5) in pure bright white -->
          <div class="d-flex justify-content-center gap-1 mb-1">
            <button class="btn btn-outline-light btn-delta text-white fw-bold px-3 py-1" data-bpm-delta="-5">-5</button>
            <button class="btn btn-outline-light btn-delta text-white fw-bold px-3 py-1" data-bpm-delta="-1">-1</button>
            <button class="btn btn-outline-light btn-delta text-white fw-bold px-3 py-1" data-bpm-delta="1">+1</button>
            <button class="btn btn-outline-light btn-delta text-white fw-bold px-3 py-1" data-bpm-delta="5">+5</button>
          </div>

          <!-- Tempo Slider -->
          <div class="px-1 mb-2">
            <input type="range" class="form-range" id="tempoSlider" min="30" max="300" value="120">
          </div>

          <!-- Customizable BPM Quick Presets (Compact margin & padding) -->
          <div class="mb-1 text-start">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <span class="text-white fw-bold text-uppercase" style="font-size: 0.85rem; letter-spacing: 0.5px;">Quick Presets</span>
              <div class="d-flex gap-2">
                <button type="button" id="toggleSavePresetBtn" class="btn btn-sm btn-outline-warning fw-bold px-2 py-0" style="font-size: 0.85rem;">
                  <i class="bi bi-pencil-square me-1"></i><span id="toggleSavePresetText">Save</span>
                </button>
                <button type="button" id="resetPresetsBtn" class="btn btn-sm btn-outline-light fw-bold px-2 py-0" style="font-size: 0.85rem;">
                  <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
                </button>
              </div>
            </div>
            <div id="savePresetHint" class="alert alert-warning py-1 px-2 fw-bold mb-1 d-none" style="font-size: 0.85rem;">
              <i class="bi bi-info-circle-fill me-1"></i>Tap a preset slot to store BPM (<strong id="saveCurrentBpmValue">120</strong>).
            </div>
            <div class="row g-1" id="quickPresetsContainer">
              <!-- 6 preset slots rendered by metronome.js -->
            </div>
          </div>
        </div>

        <!-- Metronome Settings (No redundant title, compact grid) -->
        <div class="custom-card p-2 px-3 mb-2">
          <div class="row g-2">
            <div class="col-4">
              <label for="timeSignatureSelect" class="form-label text-white fw-bold small mb-1">Signature</label>
              <select class="form-select form-select-sm text-white fw-bold" id="timeSignatureSelect">
                <option value="1">1/4</option>
                <option value="2">2/4</option>
                <option value="3">3/4</option>
                <option value="4" selected>4/4</option>
                <option value="5">5/4</option>
                <option value="6">6/8</option>
              </select>
            </div>

            <div class="col-4">
              <label for="flashModeSelect" class="form-label text-white fw-bold small mb-1">Flash</label>
              <select class="form-select form-select-sm text-white fw-bold" id="flashModeSelect">
                <option value="off">Off</option>
                <option value="subtle">Subtle</option>
                <option value="vivid" selected>Vivid</option>
                <option value="strobe">Strobe</option>
              </select>
            </div>

            <div class="col-4">
              <label for="uiSizeSelect" class="form-label text-white fw-bold small mb-1">Display</label>
              <select class="form-select form-select-sm text-white fw-bold" id="uiSizeSelect">
                <option value="large" selected>Large</option>
                <option value="xlarge">X-Large</option>
                <option value="normal">Normal</option>
              </select>
            </div>

            <div class="col-12">
              <div class="form-check form-switch pt-1">
                <input class="form-check-input" type="checkbox" id="muteAudioCheck" style="width: 2.2em; height: 1.1em;">
                <label class="form-check-label text-white fw-bold small ms-2" for="muteAudioCheck">
                  <i class="bi bi-volume-mute me-1"></i>Silent Mode (Visual metronome only)
                </label>
              </div>
            </div>
          </div>
        </div>

      </div>


      <!-- ================= 2. SETLIST TAB ================= -->
      <div class="tab-pane fade" id="pills-setlist" role="tabpanel">
        
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div>
            <h5 class="mb-0 text-white">Song Presets &amp; Setlist</h5>
            <small class="text-muted">Ordered playlist with saved tempos</small>
          </div>
          <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addSongModal">
            <i class="bi bi-plus-lg me-1"></i>Add Song
          </button>
        </div>

        <div id="setlistItemsContainer">
          <!-- Dynamically populated from localStorage -->
        </div>

      </div>


      <!-- ================= 3. TUNER TAB ================= -->
      <div class="tab-pane fade" id="pills-tuner" role="tabpanel">

        <div class="custom-card p-3 mb-3">
          <div class="row g-2 mb-3">
            <div class="col-8">
              <label for="tunerInstrumentSelect" class="form-label small text-white fw-bold">Select Instrument</label>
              <select class="form-select text-white" id="tunerInstrumentSelect">
                <option value="guitar" selected>Guitar (Standard E-A-D-G-B-E)</option>
                <option value="bass">Electric Bass (4-Str E-A-D-G)</option>
                <option value="ukulele">Ukulele (Standard G-C-E-A)</option>
                <option value="violin">Violin (Standard G-D-A-E)</option>
                <option value="banjo">Banjo 5-Strings (Open G: g-D-G-B-D)</option>
                <option value="chromatic">Chromatic (All Notes)</option>
              </select>
            </div>
            <div class="col-4">
              <label for="tunerNotationSelect" class="form-label small text-white fw-bold">Notation</label>
              <select class="form-select text-white" id="tunerNotationSelect">
                <option value="both" selected>Both (A / La)</option>
                <option value="french">French (Do Re Mi)</option>
                <option value="anglo">Anglo (A B C)</option>
              </select>
            </div>
          </div>

          <!-- Target string quick filters -->
          <div class="mb-2">
            <div class="small text-white fw-bold mb-2" style="letter-spacing: 0.3px;">Target String (Auto or click to lock):</div>
            <div id="instrumentStringsContainer" class="d-flex flex-wrap">
              <!-- Dynamically populated -->
            </div>
          </div>
        </div>

        <!-- Tuner Note Display & Gauge -->
        <div class="custom-card p-3 mb-3 text-center">

          <div id="tunerErrorAlert" class="alert alert-danger d-none py-2 px-3 small mb-3"></div>

          <div class="tuner-note-box mb-3">
            <div class="d-inline-flex align-items-baseline">
              <span id="tunerNoteName" class="tuner-note-name text-white">-</span>
              <span id="tunerNoteOctave" class="tuner-note-octave ms-1 text-white"></span>
            </div>
            <!-- French Solfege Note Display -->
            <div id="tunerNoteFrench" class="tuner-note-french">-</div>
            <div id="tunerFrequency" class="tuner-frequency">-- Hz</div>
            <div id="tunerCents" class="small fw-bold text-white mt-1">0 cents</div>
          </div>

          <!-- Gauge Needle Meter -->
          <div class="tuner-meter mb-3">
            <div class="tuner-meter-center"></div>
            <div id="tunerNeedle" class="tuner-meter-needle"></div>
          </div>

          <div class="d-flex justify-content-between text-white fw-bold small px-1 mb-4">
            <span class="text-white">-50¢ (Flat)</span>
            <span class="text-success fw-bold">IN TUNE</span>
            <span class="text-white">+50¢ (Sharp)</span>
          </div>

          <div id="tunerStatusMessage" class="text-white fw-bold small mb-3" style="font-size: 0.95rem;">Click Start to listen</div>

          <!-- Start / Stop Tuner Mic -->
          <button id="toggleTunerBtn" class="btn btn-primary w-100 py-3 fw-bold fs-5 shadow">
            <i class="bi bi-mic-fill me-2"></i>Start Tuner
          </button>
        </div>

      </div>

    </div>
  </main>

  <!-- Install App Bottom Bar (Keeps top clean and saves vertical space) -->
  <footer class="container-sm text-center py-2 mt-auto">
    <button id="pwaInstallBtn" class="btn btn-sm btn-outline-success d-none">
      <i class="bi bi-download me-1"></i>Install App
    </button>
  </footer>

  <!-- Add Song Modal -->
  <div class="modal fade" id="addSongModal" tabindex="-1" aria-labelledby="addSongModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content custom-card border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="addSongModalLabel">Add Song to Setlist</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="addSongForm">
          <div class="modal-body">
            <div class="mb-3">
              <label for="newSongTitle" class="form-label small text-muted">Song Title</label>
              <input type="text" class="form-control" id="newSongTitle" required placeholder="e.g. Come As You Are">
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label for="newSongBpm" class="form-label small text-muted">Tempo (BPM)</label>
                <input type="number" class="form-control" id="newSongBpm" min="30" max="300" value="120" required>
              </div>
              <div class="col-6">
                <label for="newSongSig" class="form-label small text-muted">Signature</label>
                <select class="form-select" id="newSongSig">
                  <option value="4" selected>4/4</option>
                  <option value="3">3/4</option>
                  <option value="2">2/4</option>
                  <option value="6">6/8</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label for="newSongNotes" class="form-label small text-muted">Notes (Optional)</label>
              <input type="text" class="form-control" id="newSongNotes" placeholder="e.g. Intro on bass, muted verse">
            </div>
          </div>
          <div class="modal-footer border-secondary">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-success">Save Song</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Application Logic -->
  <script src="./js/audio-engine.js"></script>
  <script src="./js/metronome.js"></script>
  <script src="./js/setlist.js"></script>
  <script src="./js/tuner.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
